# Reverse proxy VOLO (conteneur volo-nginx).
#
# Derriere le nginx du VPS, qui termine le HTTPS et relaie en HTTP vers
# volo-nginx:80. Point d'entree unique qui distribue les requetes :
#   /api/*            -> PHP-FPM (backend Symfony)
#   /admin*           -> PHP-FPM (back-office EasyAdmin, Twig)
#   /bundles/*        -> PHP-FPM (assets EasyAdmin)
#   /admin-theme/*    -> PHP-FPM (theme VOLO du back-office)
#   /images/products  -> PHP-FPM (VichUploader)
#   /images/brands    -> PHP-FPM (VichUploader)
#   /sitemap.xml      -> PHP-FPM
#   /*                -> Frontend (SPA React)

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Resolution DNS a la requete (DNS Docker) plutot qu'au demarrage :
    # sans cela, recreer volo-api ou volo-web (nouvelle IP) donne des 502
    # jusqu'au prochain redemarrage de ce conteneur.
    # Noms de conteneur, uniques sur le VPS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm  volo-api:9000;
    set $frontend http://volo-web:80;

    # ---- Backend Symfony (API + images uploadees + sitemap) ----

    location ~ ^/(api|admin|_wdt|_profiler|sitemap\.xml) {
        root /app/public;

        # Essayer le fichier statique d'abord, sinon passer a index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/images/(products|brands)/ {
        root /app/public;
        try_files $uri =404;
    }

    location ^~ /bundles/ {
        root /app/public;
        try_files $uri =404;
    }

    location ^~ /admin-theme/ {
        root /app/public;
        try_files $uri =404;
    }

    # Traitement PHP (FastCGI)
    location ~ \.php$ {
        root /app/public;
        fastcgi_pass $php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Eviter les timeouts sur les webhooks Stripe
        fastcgi_read_timeout 30s;

        internal;
    }

    # Webhook Stripe (route explicite pour clarte)
    location = /api/webhooks/stripe {
        root /app/public;
        try_files $uri /index.php$is_args$args;
    }

    # ---- Frontend React (SPA) ----

    location / {
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Transmis tel quel : c'est le nginx du VPS qui termine le HTTPS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Logs
    access_log /var/log/nginx/volo_access.log;
    error_log  /var/log/nginx/volo_error.log;
}
