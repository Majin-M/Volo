# Reverse proxy principal VOLO.
#
# Point d'entree unique (port 80) qui distribue les requetes :
#   /api/*            -> PHP-FPM (backend Symfony)
#   /images/products  -> PHP-FPM (VichUploader)
#   /images/brands    -> PHP-FPM (VichUploader)
#   /sitemap.xml      -> PHP-FPM
#   /*                -> Frontend (SPA React)

upstream php-fpm {
    server backend:9000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ---- Backend Symfony (API + images uploadees + sitemap) ----

    location ~ ^/(api|_wdt|_profiler|sitemap\.xml) {
        root /app/public;

        # Essayer le fichier statique d'abord, sinon passer a index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/images/(products|brands)/ {
        root /app/public;
        try_files $uri =404;
    }

    # Traitement PHP (FastCGI)
    location ~ \.php$ {
        root /app/public;
        fastcgi_pass php-fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Eviter les timeouts sur les webhooks Stripe
        fastcgi_read_timeout 30s;

        internal;
    }

    # Webhook Stripe (route explicite pour clarte)
    location = /api/webhooks/stripe {
        root /app/public;
        try_files $uri /index.php$is_args$args;
    }

    # ---- Frontend React (SPA) ----

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs
    access_log /var/log/nginx/volo_access.log;
    error_log  /var/log/nginx/volo_error.log;
}
