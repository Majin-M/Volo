# Docker Compose — VOLO, pile de production.
# Les outils de développement (Mailpit) sont dans docker-compose.override.yml.
# Variables : .env à la racine, modèle .env.example. Mise en route : README.md.
#
#   nginx (80) -> frontend (SPA React) | backend (PHP-FPM 9000) -> db (MySQL 8.0)
#   scheduler  -> tâches planifiées

services:

  # Reverse proxy : point d'entrée unique.
 #nginx:
   # image: nginx:alpine
    # container_name: volo-nginx
    # expose:
    #   - "80"
    # volumes:
    #   - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    #   - backend_public:/app/public:ro
    # depends_on:
    #   backend:
    #     # Attend que PHP-FPM écoute, pour éviter des 502 au démarrage.
    #     condition: service_healthy
    #   frontend:
    #     condition: service_started
    # restart: unless-stopped
    # networks:
    #   - web

  # Backend Symfony (PHP-FPM).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volo-api
    volumes:
      - backend_public:/app/public
      # Clés JWT conservées entre deux builds : les sessions restent valides.
      - jwt_keys:/app/config/jwt
    # Ancre YAML réutilisée par `scheduler`.
    environment: &backend-environment
      APP_ENV: prod
      # ${VAR:?} : Compose refuse de démarrer si la variable est absente.
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant dans .env - generer avec openssl rand -hex 16}
      # URL publique, pour les liens générés hors requête (emails, sitemap).
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI manquant dans .env}
      # 8.0.0 et non 8.0 : Doctrine sélectionnerait sinon une plateforme MySQL générique.
      DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER manquant dans .env}:${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant dans .env}@db:3306/${MYSQL_DATABASE:?MYSQL_DATABASE manquant dans .env}?serverVersion=8.0.0&charset=utf8mb4
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN manquant dans .env}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant dans .env}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM manquant dans .env}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant dans .env - generer avec openssl rand -hex 24}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN manquant dans .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY manquant dans .env}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY manquant dans .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    # Sain une fois php-fpm en écoute, donc après les migrations de l'entrypoint.
    # Test en PHP : l'option -z de `nc` n'est pas garantie sous busybox.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - web

  # Tâches planifiées : annule les commandes impayées depuis plus de 60 minutes,
  # ferme leur paiement Stripe et restitue leur stock.
  # Une boucle suffit ici, sans ajouter Symfony Scheduler ni worker Messenger.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volo-scheduler
    environment: *backend-environment
    # Entrypoint du backend court-circuité : migrations et clés JWT y sont déjà faites.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do
        echo "[scheduler] $$(date -u +%Y-%m-%dT%H:%M:%SZ) balayage des commandes abandonnees";
        php bin/console app:release-stale-orders --minutes=60 --no-interaction || echo "[scheduler] ECHEC du balayage (code $$?)";
        sleep ${SWEEP_INTERVAL_SECONDS:-900};
        done
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web

  # Frontend React : build Vite servi par Nginx.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Clé PUBLIQUE uniquement (pk_...) : Vite l'intègre au bundle au build.
        VITE_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY manquant dans .env}
    container_name: volo-web
    restart: unless-stopped
    networks:
      - web

  # Base de données.
  db:
    image: mysql:8.0
    container_name: volo-db
    environment:
      # Appliqués à la première initialisation du volume db_data uniquement.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE manquant dans .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER manquant dans .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant dans .env}
    # Aucun port publié : la base n'est joignable que par le réseau interne.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - web

volumes:
  db_data:
  backend_public:
  jwt_keys:

networks:
  web: 
    external: true


