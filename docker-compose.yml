# =============================================================================
# Docker Compose — VOLO (monorepo Symfony + React) — BASE DE PRODUCTION
# =============================================================================
# Ce fichier decrit ce qui tourne sur un serveur, et RIEN d'autre.
# Le developpement ajoute ses outils via docker-compose.override.yml, que
# Compose charge automatiquement a cote de celui-ci.
#
#   En local   : docker compose up -d --build
#                (charge docker-compose.yml + docker-compose.override.yml)
#   En serveur : docker compose -f docker-compose.yml up -d --build
#                (ou COMPOSE_FILE=docker-compose.yml dans le .env du serveur)
#
# Configuration : le fichier .env A LA RACINE (modele : .env.example).
#
# Les secrets sont OBLIGATOIRES — syntaxe ${VAR:?message}. Une variable
# absente ou vide fait echouer `docker compose` avant tout demarrage.
# Auparavant, ${VAR:-defaut} laissait la pile demarrer avec des valeurs
# publiees dans ce depot (APP_SECRET=change-me-in-production, passphrase JWT
# connue) : une configuration oubliee passait inapercue. Limite a connaitre :
# ${VAR:?} detecte une valeur MANQUANTE, pas une valeur restee a son exemple.
#
# Architecture :
#   nginx (port 80)  ->  frontend (SPA React, port interne 80)
#                    ->  backend  (PHP-FPM, port interne 9000)
#                    ->  db       (MySQL 8.0, port interne 3306, non publie)
# =============================================================================

services:

  # --- Reverse proxy : point d'entree unique ---
  nginx:
    image: nginx:alpine
    container_name: volo-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/app/public:ro
    depends_on:
      backend:
        # service_healthy et non service_started : Nginx demarrait avant que
        # PHP-FPM ecoute, et les premieres requetes rendaient un 502.
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  # --- Backend Symfony (PHP-FPM) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volo-backend
    volumes:
      - backend_public:/app/public
      # Les cles JWT survivent aux reconstructions d'image. Sans ce volume,
      # chaque `docker compose build` en generait de nouvelles et invalidait
      # tous les jetons en circulation : tous les clients deconnectes a
      # chaque deploiement.
      - jwt_keys:/app/config/jwt
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET manquant dans .env - generer avec openssl rand -hex 16}
      # URL publique, utilisee pour les liens generes hors requete HTTP
      # (emails, sitemap). En production : https://votre-domaine.
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI manquant dans .env}
      # Construite depuis les memes variables que le service `db` : un seul
      # endroit pour les identifiants, plus aucun mot de passe dans ce depot.
      #
      # serverVersion=8.0.0 et NON 8.0 : DBAL juge "8.0" INFERIEUR a "8.0.0"
      # et selectionnait alors MySQLPlatform, la plateforme generique, au lieu
      # de MySQL80Platform. 8.0.0 plutot que 8.0.46 : l'image mysql:8.0 fait
      # evoluer le correctif, et ce plancher suffit.
      DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER manquant dans .env}:${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant dans .env}@db:3306/${MYSQL_DATABASE:?MYSQL_DATABASE manquant dans .env}?serverVersion=8.0.0&charset=utf8mb4
      # Plus de valeur par defaut pointant vers Mailpit : en production,
      # Mailpit n'existe pas, et un DSN vers `mailer` aurait fait disparaitre
      # tous les emails sans erreur visible.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN manquant dans .env}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant dans .env}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM manquant dans .env}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE manquant dans .env - generer avec openssl rand -hex 24}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN manquant dans .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY manquant dans .env}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY manquant dans .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET manquant dans .env}
    depends_on:
      db:
        condition: service_healthy
    # Le conteneur n'est « sain » qu'une fois php-fpm en ecoute, donc APRES
    # que l'entrypoint a joue les migrations. C'est ce qui permet a Nginx
    # d'attendre une application reellement prete plutot qu'un conteneur
    # simplement demarre.
    #
    # Le test passe par PHP et non par `nc` : busybox ne garantit pas
    # l'option -z, et un healthcheck qui echoue pour une raison etrangere au
    # service est pire qu'une absence de healthcheck.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # --- Frontend React (Vite build + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Consommee par `vite build` dans le Dockerfile. Doit etre la cle
        # PUBLIQUE Stripe (pk_...) : elle finit dans le bundle, donc visible
        # par le navigateur. Ne jamais y mettre la cle secrete.
        # Obligatoire : Vite la fige AU BUILD, une valeur vide produisait un
        # paiement mort en production sans aucune erreur au deploiement.
        VITE_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:?STRIPE_PUBLIC_KEY manquant dans .env}
    container_name: volo-frontend
    restart: unless-stopped

  # --- Base de donnees ---
  db:
    image: mysql:8.0
    container_name: volo-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE manquant dans .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER manquant dans .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant dans .env}
    # PIEGE : l'image mysql n'applique MYSQL_USER / MYSQL_PASSWORD /
    # MYSQL_ROOT_PASSWORD qu'a la PREMIERE initialisation du volume db_data.
    # Les modifier ensuite dans .env ne change PAS les comptes existants : le
    # backend echoue alors a se connecter. Changer un mot de passe apres coup
    # se fait dans MySQL (ALTER USER), pas dans ce fichier.
    #
    # AUCUN port publie sur l'hote, deliberement : `"3306:3306"` ouvrait la
    # base de production sur Internet. Le backend l'atteint par le reseau
    # interne de Compose. Pour l'inspecter : `docker compose exec db mysql -u root -p`.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  backend_public:
  jwt_keys:
