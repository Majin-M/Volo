# Surcharge de développement, fusionnée automatiquement avec docker-compose.yml.
# Ne doit pas être chargée sur un serveur (voir README.md).

services:

  # Mailpit : capture les emails sans les envoyer (MAILER_DSN=smtp://mailer:1025).
  mailer:
    image: axllent/mailpit
    # Pas de container_name : évite une collision avec d'autres projets.
    expose:
      # Liés à 127.0.0.1 : l'interface n'a pas d'authentification.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
    networks:
      - web

  backend:
    depends_on:
      mailer:
        condition: service_started
    networks:
      - web
