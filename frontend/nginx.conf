# Configuration Nginx pour le frontend VOLO (SPA React).
# En production, ce serveur est derriere le reverse proxy principal (docker/nginx/).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes inconnues renvoient vers index.html
    # pour que React Router gere le routage cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressif sur les assets hashes par Vite (nom.HASH.js/css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
